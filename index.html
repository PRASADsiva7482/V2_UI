<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard App</title>
    <script src="%BASE_URL%config.js"></script>
    <script type="text/javascript">
      (function () {
        var l = window.location;
        if (l.search && l.search.startsWith('?/')) {
          var decoded = l.search.slice(2);
          var newUrl = l.pathname.replace(/\/$/, '') + '/' + decoded + l.hash;
          window.history.replaceState(null, null, newUrl);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="%BASE_URL%src/main.jsx"></script>
  </body>
</html>
