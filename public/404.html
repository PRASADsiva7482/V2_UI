<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      (function () {
        var l = window.location;
        var base = l.pathname.split('/')[1];
        if (!base) {
          l.replace(l.origin + '/');
          return;
        }
        var newUrl = l.origin + '/' + base + '/?/' + l.pathname.slice(('/' + base + '/').length) + l.search + l.hash;
        l.replace(newUrl);
      })();
    </script>
  </head>
  <body></body>
</html>
